<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerario Viaje Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 10px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        .main-nav { position: sticky; top: 0; background: white; z-index: 1000; padding: 10px 0; border-bottom: 1px solid #d1d1d6; display: flex; flex-direction: column; gap: 8px; }
        .nav-row-quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .action-btn { padding: 2px; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; min-height: 35px; cursor: pointer; }
        
        .dia-container { margin-bottom: 15px; border: 1px solid #d1d1d6; border-radius: 12px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
        .bloque-dia-header { background: #1c1c1e; color: white; display: grid; grid-template-columns: 1fr auto 40px; align-items: center; cursor: pointer; min-height: 65px; }
        .header-info-wrapper { padding: 6px 12px; display: flex; flex-direction: column; }
        .header-info-wrapper h3 { margin: 0; font-size: 11px; font-weight: 400; opacity: 0.7; text-transform: uppercase; }
        .nombre-dia-personalizado { font-size: 20px; font-weight: 800; line-height: 1.1; min-width: 100px; }
        
        .clima-wrapper { display: flex; align-items: center; gap: 8px; padding-right: 12px; }
        .clima-icon { font-size: 26px; }
        .temp-row { display: flex; gap: 5px; font-size: 16px; font-weight: 900; }

        .dia-management-block { display: flex; flex-direction: column; background: #2c2c2e; border-left: 1px solid #3a3a3c; align-self: stretch; justify-content: center; }
        .btn-dia-order { background: transparent; border: none; color: white; font-size: 12px; padding: 4px; cursor: pointer; }
        .btn-dia-delete { color: #ff453a; font-size: 16px; padding: 4px; text-align: center; cursor: pointer; }

        .dia-contenido { display: none; padding-bottom: 10px; }
        .dia-contenido.abierto { display: block; }
        .dia-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; background: #f2f2f7; }
        
        .bloque { margin: 8px; border: 1px solid #e5e5ea; border-radius: 10px; position: relative; padding-left: 32px; background: #fff; overflow: hidden; }
        .bloque.completado { opacity: 0.4; filter: grayscale(1); }
        .controls-left { position: absolute; left: 0; top: 0; bottom: 0; width: 32px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #e5e5ea; background: #f9f9f9; z-index: 10; }
        .btn-ctrl { width: 100%; flex: 1; border: none; background: transparent; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        table { width: 100%; border-collapse: collapse; }
        td { padding: 8px 6px; border-bottom: 1px solid #f2f2f7; font-size: 14px; }
        .destacado td { font-weight: 800; color: white; }
        .col-label { width: 1px; white-space: nowrap; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; padding-right: 10px; }
        .col-data { width: 100%; }

        .tipo-visita { background-color: #34c759 !important; }
        .tipo-comida { background-color: #ff9500 !important; }
        .tipo-cena { background-color: #af52de !important; }
        .tipo-salida { background-color: #8e8e93 !important; }

        .btn-mapa { cursor: pointer; font-size: 18px; opacity: 0.3; transition: opacity 0.3s; }
        .btn-mapa.con-url { opacity: 1; filter: drop-shadow(0 0 2px rgba(0,0,0,0.2)); }
        
        .media-area { width: 100%; display: block; margin-top: 5px; }
        .media-item img { width: 100%; border-radius: 8px; margin-bottom: 5px; }
        .media-item audio { width: 100%; height: 35px; margin-bottom: 5px; }
        .media-btns { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="titulo-viaje" contenteditable="true" style="text-align:center; margin: 10px 0;" onblur="saveAll()">Mi Itinerario</h2>
    
    <div class="main-nav">
        <div class="nav-row-quad">
            <button class="action-btn" style="background:#007aff" onclick="exportarDatos()">⬇️ Guardar</button>
            <button class="action-btn" style="background:#34c759" onclick="document.getElementById('import-file').click()">📂 Abrir</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importarDatos(this)">
            <button id="sync-btn" class="action-btn" style="background:#5856d6" onclick="sincronizarGitHub()">🔄 Sync</button>
            <button class="action-btn" style="background:#1c1c1e" onclick="addDia()">+ Día</button>
        </div>
    </div>

    <div id="itinerario"></div>
    <button class="action-btn" style="background:#ff3b30; width: 100%; margin-top: 15px;" onclick="limpiarTodo()">🗑️ Borrar Todo</button>
</div>

<script>
    const weatherIcons = { 0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 51: "🌦️", 61: "🌧️", 71: "❄️", 95: "⛈️" };
    const GITHUB_URL = "https://raw.githubusercontent.com/antoniodetm/mi-viaje/main/itinerario_viaje.json";

    window.onload = () => {
        const saved = localStorage.getItem('miItinerario');
        const savedTitle = localStorage.getItem('tituloViaje');
        if (savedTitle) document.getElementById('titulo-viaje').innerText = savedTitle;
        if (saved && saved !== "undefined" && saved.trim() !== "") {
            document.getElementById('itinerario').innerHTML = saved;
            actualizarEfectos();
        } else { addDia(); }
    };

    function saveAll() {
        document.querySelectorAll('input[type="time"]').forEach(i => i.setAttribute('value', i.value));
        document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked ? i.setAttribute('checked', 'checked') : i.removeAttribute('checked'));
        document.querySelectorAll('.btn-mapa').forEach(pin => {
            if(pin.dataset.url) pin.setAttribute('data-url', pin.dataset.url);
        });
        localStorage.setItem('miItinerario', document.getElementById('itinerario').innerHTML);
        localStorage.setItem('tituloViaje', document.getElementById('titulo-viaje').innerText);
    }

    function exportarDatos() {
        saveAll();
        const d = { titulo: document.getElementById('titulo-viaje').innerText, cuerpo: document.getElementById('itinerario').innerHTML };
        const blob = new Blob([JSON.stringify(d)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "itinerario_viaje.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function cargarJSON(d) {
        if (!d) return;
        document.getElementById('itinerario').innerHTML = d.cuerpo || d.itinerario || "";
        document.getElementById('titulo-viaje').innerText = d.titulo || "Mi Itinerario";
        saveAll();
        actualizarEfectos();
        alert("¡Datos cargados!");
    }

    function importarDatos(input) {
        if (!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => { try { cargarJSON(JSON.parse(e.target.result)); } catch (err) { alert("Error."); } };
        reader.readAsText(input.files[0]);
        input.value = "";
    }

    async function sincronizarGitHub() {
        const btn = document.getElementById('sync-btn'); btn.innerText = "⌛...";
        try {
            const resp = await fetch(`https://api.codetabs.com/v1/proxy?quest=${GITHUB_URL}&t=${Date.now()}`);
            const d = await resp.json();
            if (confirm("¿Sincronizar?")) cargarJSON(d);
        } catch (e) { alert("Error Sync."); } finally { btn.innerText = "🔄 Sync"; }
    }

    function addDia() {
        let fecha = new Date().toISOString().split('T')[0];
        const id = "dia-" + Date.now();
        const html = `<div class="dia-container" id="${id}">
            <div class="bloque-dia-header" onclick="toggleDia(this)">
                <div class="header-info-wrapper">
                    <h3 contenteditable="true" onclick="event.stopPropagation()">DÍA: ${fecha}</h3>
                    <div class="nombre-dia-personalizado" contenteditable="true" onblur="fetchClimaGlobal(this)">Destino...</div>
                </div>
                <div class="clima-wrapper"></div>
                <div class="dia-management-block">
                    <button class="btn-dia-order" onclick="event.stopPropagation(); moverDia(this, 'arriba')">▲</button>
                    <span class="btn-dia-delete" onclick="event.stopPropagation(); if(confirm('¿Borrar?')){this.closest('.dia-container').remove();saveAll();}">✕</span>
                    <button class="btn-dia-order" onclick="event.stopPropagation(); moverDia(this, 'abajo')">▼</button>
                </div>
            </div>
            <div class="dia-contenido">
                <div class="dia-controls">
                    <button class="action-btn tipo-visita" onclick="addEvento('${id}', 'visita')">Visita</button>
                    <button class="action-btn tipo-comida" onclick="addEvento('${id}', 'comida')">Comida</button>
                    <button class="action-btn tipo-cena" onclick="addEvento('${id}', 'cena')">Cena</button>
                    <button class="action-btn tipo-salida" onclick="addEvento('${id}', 'salida')">Salida</button>
                </div>
                <div class="eventos-lista"></div>
            </div>
        </div>`;
        document.getElementById('itinerario').insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function addEvento(diaId, tipo) {
        const lista = document.querySelector(`#${diaId} .eventos-lista`);
        const conf = { visita:['tipo-visita','VISITA'], comida:['tipo-comida','COMIDA'], cena:['tipo-cena','CENA'], salida:['tipo-salida','SALIDA'] };
        const [clase, titulo] = conf[tipo];
        const html = `<div class="bloque">
            <div class="controls-left">
                <input type="checkbox" class="check-completar" onclick="toggleCompletado(this)">
                <button class="btn-ctrl" onclick="moveUp(this)">▲</button>
                <button class="btn-ctrl" onclick="moveDown(this)">▼</button>
                <button class="btn-ctrl" style="color:red" onclick="this.closest('.bloque').remove();saveAll();">✕</button>
            </div>
            <table oninput="saveAll()">
                <tr class="destacado ${clase}"><td colspan="2" contenteditable="true">${titulo}</td><td style="text-align:right"><input type="time" onchange="saveAll()"></td></tr>
                <tr><td class="col-label">Lugar</td><td contenteditable="true" class="col-data">...</td><td style="text-align:right" class="btn-mapa" data-url="" onclick="gestionarMapa(this)">📍</td></tr>
                <tr><td class="col-label">Notas</td><td colspan="2" contenteditable="true" class="col-data"></td></tr>
                <tr><td class="col-label">Media</td><td colspan="2" class="col-data">
                    <div class="media-area"></div>
                    <div class="media-btns">
                        <button class="action-btn" style="background:#8e8e93; width:40px;" onclick="this.nextElementSibling.click()">📸</button>
                        <input type="file" hidden accept="image/*" onchange="processFile(this, 'img')">
                        <button class="action-btn" style="background:#5856d6; width:40px;" onclick="this.nextElementSibling.click()">🎙️</button>
                        <input type="file" hidden accept="audio/*" onchange="processFile(this, 'aud')">
                    </div>
                </td></tr>
            </table>
        </div>`;
        lista.insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function gestionarMapa(el) {
        let urlExistente = el.dataset.url || el.getAttribute('data-url');
        if (!urlExistente || urlExistente === "") {
            let nuevaUrl = prompt("Pega aquí la URL:");
            if (nuevaUrl) { el.dataset.url = nuevaUrl; el.setAttribute('data-url', nuevaUrl); el.classList.add('con-url'); saveAll(); }
        } else {
            if (confirm("¿Abrir enlace?")) { window.open(urlExistente, "_blank"); }
            else { let n = prompt("Editar URL:", urlExistente); if(n!==null){ el.dataset.url=n; el.setAttribute('data-url',n); n===""?el.classList.remove('con-url'):el.classList.add('con-url'); saveAll(); } }
        }
    }

    function processFile(input, tipo) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = e => {
            const container = input.closest('td').querySelector('.media-area');
            if(tipo === 'img') container.innerHTML += `<div class="media-item"><img src="${e.target.result}"></div>`;
            else container.innerHTML += `<div class="media-item"><audio controls src="${e.target.result}"></audio></div>`;
            saveAll();
        };
        reader.readAsDataURL(input.files[0]);
    }

    async function fetchClimaGlobal(el) {
        const nombre = el.innerText.trim();
        const wrapperClima = el.closest('.dia-container').querySelector('.clima-wrapper');
        if (!nombre || nombre === "Destino...") return;
        try {
            const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nombre)}&count=1&language=es&format=json`);
            const geoData = await geo.json();
            if (geoData.results) {
                const { latitude, longitude } = geoData.results[0];
                const weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
                const wData = await weather.json();
                wrapperClima.innerHTML = `<span class="clima-icon">${weatherIcons[wData.daily.weathercode[0]] || "🌡️"}</span><div class="temp-row"><span style="color:#ff453a">${Math.round(wData.daily.temperature_2m_max[0])}°</span><span style="color:#0a84ff">${Math.round(wData.daily.temperature_2m_min[0])}°</span></div>`;
                saveAll();
            }
        } catch (e) {}
    }

    function toggleDia(header) { if (event.target.hasAttribute('contenteditable') || event.target.tagName === 'BUTTON') return; header.nextElementSibling.classList.toggle('abierto'); }
    function toggleCompletado(check) { check.closest('.bloque').classList.toggle('completado', check.checked); saveAll(); }
    function moverDia(btn, dir) { const dia = btn.closest('.dia-container'); dir === 'arriba' ? dia.previousElementSibling?.before(dia) : dia.nextElementSibling?.after(dia); saveAll(); }
    function moveUp(btn) { const b = btn.closest('.bloque'); b.previousElementSibling?.before(b); saveAll(); }
    function moveDown(btn) { const b = btn.closest('.bloque'); b.nextElementSibling?.after(b); saveAll(); }
    function limpiarTodo() { if(confirm("¿Borrar?")) { localStorage.clear(); location.reload(); } }
    
    function actualizarEfectos() { 
        document.querySelectorAll('.check-completar').forEach(c => { if(c.hasAttribute('checked')) { c.checked = true; c.closest('.bloque').classList.add('completado'); } });
        document.querySelectorAll('input[type="time"]').forEach(i => { if(i.hasAttribute('value')) i.value = i.getAttribute('value'); });
        document.querySelectorAll('.btn-mapa').forEach(pin => {
            const url = pin.getAttribute('data-url');
            if(url && url !== "") { pin.dataset.url = url; pin.classList.add('con-url'); }
        });
    }
</script>
</body>
</html>
