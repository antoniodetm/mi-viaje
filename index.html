<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerario Viaje Pro - Control Unificado</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f2f2f7; margin: 0; padding: 10px; 
            display: flex; flex-direction: column; align-items: center; 
        }
        .container { 
            background: white; padding: 10px; border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; 
            max-width: 400px; box-sizing: border-box; 
        }
        
        .main-nav { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        .nav-row-triple { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        
        .action-btn { 
            padding: 2px; border: none; border-radius: 8px; 
            font-weight: 600; font-size: 11px; color: white; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 30px; cursor: pointer; text-decoration: none; text-align: center;
        }

        .dia-container { margin-bottom: 10px; border: 1px solid #d1d1d6; border-radius: 12px; background: #fff; overflow: hidden; }
        
        .bloque-dia-header { 
            background: #1c1c1e; color: white; padding: 12px; 
            display: flex; justify-content: space-between; align-items: flex-start; 
            cursor: pointer;
        }

        .header-info-wrapper { display: flex; flex-direction: column; flex: 1; min-width: 0; padding-right: 5px; }
        .bloque-dia-header h3 { margin: 0; font-size: 11px; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }

        .nombre-dia-personalizado { 
            font-size: 18px; font-weight: bold; border: none; background: transparent; 
            color: white; outline: none; padding: 0; width: 100%; white-space: normal; 
            word-break: break-word; display: block; line-height: 1.2; min-height: 22px;
        }

        .nombre-dia-personalizado:empty:before { content: attr(data-placeholder); color: #8e8e93; }
        
        .clima-wrapper { 
            display: flex; align-items: center; gap: 5px; 
            margin: 0 8px; min-width: 55px; justify-content: flex-end;
            align-self: center;
        }
        .clima-icon { font-size: 24px; }
        .temp-wrapper { display: flex; flex-direction: column; align-items: flex-end; line-height: 1; }
        .temp-max { color: #ff453a; font-size: 13px; font-weight: bold; }
        .temp-min { color: #0a84ff; font-size: 11px; font-weight: bold; margin-top: 2px; }

        /* NUEVA DISPOSICIÓN: FLECHAS Y CRUZ */
        .dia-management-block {
            display: flex;
            align-items: center;
            gap: 10px;
            align-self: center;
            border-left: 1px solid rgba(255,255,255,0.15);
            padding-left: 10px;
        }

        .dia-order-controls { 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
        }
        
        .btn-dia-order { 
            background: rgba(255,255,255,0.1); 
            border: none; 
            color: white; 
            border-radius: 4px; 
            width: 26px; 
            height: 20px; 
            font-size: 10px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-dia-order:active { background: rgba(255,255,255,0.3); }

        .btn-delete-dia {
            font-size: 20px; 
            opacity: 0.6;
            cursor: pointer;
            color: #ff453a;
            padding: 5px;
        }
        .btn-delete-dia:active { opacity: 1; }

        .dia-contenido { display: none; padding-bottom: 10px; }
        .dia-contenido.abierto { display: block; }
        .dia-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: #f2f2f7; border-bottom: 1px solid #d1d1d6; }
        
        .bloque { margin: 6px; border: 1px solid #e5e5ea; border-radius: 10px; position: relative; padding-left: 30px; background: #fff; overflow: hidden;}
        .controls-left { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; display: flex; flex-direction: column; border-right: 1px solid #e5e5ea; background: #f9f9f9; }
        .btn-ctrl { flex: 1; border: none; background: transparent; font-size: 12px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        td { padding: 6px; border-bottom: 1px solid #f2f2f7; font-size: 15px; vertical-align: middle; }
        .header-texto { font-size: 18px !important; }
        .col-label { width: 50px; font-size: 10px; color: #8e8e93; text-transform: uppercase; font-weight: bold; }
        
        .pin-container { display: flex; align-items: center; position: relative; gap: 6px; }
        .pin-map { cursor: pointer; font-size: 20px; filter: grayscale(1); }
        .pin-active { filter: grayscale(0) !important; }
        .btn-quitar-mapa { color: #ff3b30; font-size: 14px; cursor: pointer; display: none; }
        .pin-active + .btn-quitar-mapa { display: inline; }

        input[type="time"] { border: 1px solid #d1d1d6; border-radius: 4px; padding: 2px; font-size: 12px; }
        .destacado td { font-weight: 800; color: white; }
        .tipo-visita { background-color: #34c759 !important; }
        .tipo-comida { background-color: #ff9500 !important; }
        .tipo-cena { background-color: #af52de !important; }
        .tipo-salida { background-color: #8e8e93 !important; }
    </style>
</head>
<body onclick="closeAllPopovers(event)">

<div class="container">
    <h2 id="titulo-viaje" contenteditable="true" style="text-align:center; font-size: 20px; margin: 10px 0;" onblur="saveAll()">Mi Itinerario</h2>
    
    <div class="main-nav">
        <button class="action-btn" style="background:#1c1c1e; min-height: 40px; font-size: 15px;" onclick="addDia()">+ Añadir Día</button>
        <div class="nav-row-triple">
            <button class="action-btn" style="background:#007aff" onclick="exportarDatos()">⬇️ Guardar</button>
            <button class="action-btn" style="background:#5856d6" onclick="sincronizarGitHub()">🔄 Sync</button>
            <label for="importFile" class="action-btn" style="background:#8e8e93">⬆️ Abrir</label>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDatos(this)">
        </div>
    </div>

    <div id="itinerario"></div>
    <button class="action-btn" style="background:#ff3b30; width: 100%; margin-top: 15px; min-height: 35px;" onclick="limpiarTodo()">🗑️ Borrar Todo</button>
</div>

<script>
    const weatherIcons = { 0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 51: "🌦️", 61: "🌧️", 71: "❄️", 95: "⛈️" };

    window.onload = () => {
        const saved = localStorage.getItem('miItinerario');
        const savedTitle = localStorage.getItem('tituloViaje');
        if (savedTitle) document.getElementById('titulo-viaje').innerText = savedTitle;
        if (saved && saved.trim() !== "") {
            document.getElementById('itinerario').innerHTML = saved;
            actualizarEfectos();
        } else { addDia(); }
    };

    function toggleDia(header) {
        if (event.target.classList.contains('nombre-dia-personalizado') || event.target.closest('.dia-management-block')) return;
        const contenido = header.nextElementSibling;
        if(contenido) contenido.classList.toggle('abierto');
        saveAll();
    }

    function moverDia(btn, direccion) {
        const dia = btn.closest('.dia-container');
        direccion === 'arriba' ? (dia.previousElementSibling && dia.parentNode.insertBefore(dia, dia.previousElementSibling)) : (dia.nextElementSibling && dia.parentNode.insertBefore(dia.nextElementSibling, dia));
        saveAll();
    }

    async function fetchClimaGlobal(el) {
        const nombre = el.innerText.trim();
        if (!nombre) return;
        const container = el.closest('.dia-container');
        const wrapperClima = container.querySelector('.clima-wrapper');
        const diaHeader = container.querySelector('h3').innerText;
        const fecha = diaHeader.match(/\d{4}-\d{2}-\d{2}/) ? diaHeader.match(/\d{4}-\d{2}-\d{2}/)[0] : new Date().toISOString().split('T')[0];
        try {
            const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nombre)}&count=1&language=es&format=json`);
            const geoData = await geo.json();
            if (!geoData.results) return;
            const { latitude, longitude } = geoData.results[0];
            const weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${fecha}&end_date=${fecha}`);
            const wData = await weather.json();
            if (wData.daily) {
                const icon = weatherIcons[wData.daily.weathercode[0]] || "🌡️";
                const max = Math.round(wData.daily.temperature_2m_max[0]);
                const min = Math.round(wData.daily.temperature_2m_min[0]);
                wrapperClima.innerHTML = `
                    <span class="clima-icon">${icon}</span>
                    <div class="temp-wrapper">
                        <span class="temp-max">${max}°</span>
                        <span class="temp-min">${min}°</span>
                    </div>`;
                saveAll();
            }
        } catch (e) { console.error(e); }
    }

    function saveAll() {
        document.querySelectorAll('input[type="time"]').forEach(i => i.setAttribute('value', i.value));
        document.querySelectorAll('.map-url-input').forEach(i => i.setAttribute('value', i.value));
        localStorage.setItem('miItinerario', document.getElementById('itinerario').innerHTML);
        localStorage.setItem('tituloViaje', document.getElementById('titulo-viaje').innerText);
    }

    function addDia() {
        const id = "dia-" + Date.now();
        const hoy = new Date().toISOString().split('T')[0];
        const html = `<div class="dia-container" id="${id}">
            <div class="bloque-dia-header" onclick="toggleDia(this)">
                <div class="header-info-wrapper">
                    <h3 contenteditable="true" onclick="event.stopPropagation()">DÍA: ${hoy}</h3>
                    <div class="nombre-dia-personalizado" contenteditable="true" data-placeholder="Nombre del lugar..." 
                         onblur="fetchClimaGlobal(this)" oninput="saveAll()"></div>
                </div>
                <div class="clima-wrapper"><span class="clima-icon">☁️</span></div>
                <div class="dia-management-block">
                    <div class="dia-order-controls">
                        <button class="btn-dia-order" onclick="moverDia(this, 'arriba')">▲</button>
                        <button class="btn-dia-order" onclick="moverDia(this, 'abajo')">▼</button>
                    </div>
                    <span class="btn-delete-dia" onclick="if(confirm('¿Borrar día?')){this.closest('.dia-container').remove();saveAll();}">✕</span>
                </div>
            </div>
            <div class="dia-contenido">
                <div class="dia-controls">
                    <button class="action-btn" style="background:#8e8e93" onclick="addEvento('${id}', 'solo-salida')">Salida</button>
                    <button class="action-btn" style="background:#34c759" onclick="addEvento('${id}', 'visita')">Visita</button>
                    <button class="action-btn" style="background:#ff9500" onclick="addEvento('${id}', 'comida')">Comida</button>
                    <button class="action-btn" style="background:#af52de" onclick="addEvento('${id}', 'cena')">Cena</button>
                </div>
                <div class="eventos-lista"></div>
            </div>
        </div>`;
        document.getElementById('itinerario').insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function addEvento(diaId, tipo) {
        const lista = document.querySelector(`#${diaId} .eventos-lista`);
        let clase = 'tipo-visita', texto = 'VISITA', dual = true;
        if(tipo === 'comida') { clase = 'tipo-comida'; texto = 'COMIDA'; }
        if(tipo === 'cena') { clase = 'tipo-cena'; texto = 'CENA'; }
        if(tipo === 'solo-salida') { clase = 'tipo-salida'; texto = 'SALIDA'; dual = false; }
        const html = `<div class="bloque">
            <div class="controls-left">
                <button class="btn-ctrl" style="color:#ff3b30" onclick="if(confirm('¿Borrar?')){this.closest('.bloque').remove();saveAll();}">✕</button>
                <button class="btn-ctrl" onclick="moveUp(this)">▲</button>
                <button class="btn-ctrl" onclick="moveDown(this)">▼</button>
            </div>
            <table oninput="saveAll()">
                <tr class="destacado ${clase}"><td colspan="2" class="header-texto" contenteditable="true">${texto}</td><td style="text-align:right"><input type="time" class="time-start"></td></tr>
                <tr><td class="col-label">Lugar</td><td colspan="2"><div style="display:flex;align-items:center;"><span class="lugar-texto" contenteditable="true" style="flex:1">...</span><div class="pin-container"><span class="pin-map" onclick="handlePinClick(this, event)">📍</span><span class="btn-quitar-mapa" onclick="quitarMapa(this, event)">✕</span><div class="map-popover" style="display:none; position:absolute; background:white; border:1px solid #ccc; padding:10px; z-index:100; right:0; top:30px;"><input type="text" class="map-url-input" placeholder="URL Maps..." oninput="checkPinStatus(this)"><button class="action-btn" style="background:#34c759;width:100%;margin-top:4px;" onclick="this.parentElement.style.display='none'">OK</button></div></div></div></td></tr>
                <tr><td class="col-label">Notas</td><td colspan="2" class="notas-cell" contenteditable="true">...</td></tr>
                <tr><td class="col-label">Media</td><td colspan="2"><div style="display:flex; gap:10px;"><span class="file-input-label" onclick="handleMediaAction(this, 'img')">🖼️</span><input type="file" accept="image/*" style="display:none" onchange="processFile(this, 'img')"><span class="file-input-label" onclick="handleMediaAction(this, 'audio')">🎤</span><input type="file" accept="audio/*" style="display:none" onchange="processFile(this, 'audio')"></div><div class="media-preview"></div><div class="audio-player"></div></td></tr>
                ${dual ? `<tr><td class="col-label">Salida</td><td colspan="2" style="text-align:right"><input type="time" class="time-end"></td></tr>` : ''}
            </table>
        </div>`;
        lista.insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function closeAllPopovers(e) { if (!e.target.closest('.map-popover') && !e.target.closest('.pin-map')) { document.querySelectorAll('.map-popover').forEach(p => p.style.display = 'none'); } }
    function checkPinStatus(input) { const pin = input.parentElement.previousElementSibling.previousElementSibling; if(pin) { input.value.trim().includes('maps') ? pin.classList.add('pin-active') : pin.classList.remove('pin-active'); saveAll(); } }
    function handlePinClick(btn, event) { event.stopPropagation(); const pop = btn.parentElement.querySelector('.map-popover'); if (btn.classList.contains('pin-active')) { window.open(pop.querySelector('input').value, '_blank'); } else { pop.style.display = 'block'; } }
    function quitarMapa(btn, event) { event.stopPropagation(); if(confirm("¿Quitar enlace?")) { const c = btn.parentElement; c.querySelector('input').value = ""; c.querySelector('.pin-map').classList.remove('pin-active'); saveAll(); } }
    function moveUp(btn) { const c = btn.closest('.bloque'); if (c.previousElementSibling) { c.parentNode.insertBefore(c, c.previousElementSibling); saveAll(); } }
    function moveDown(btn) { const c = btn.closest('.bloque'); if (c.nextElementSibling) { c.parentNode.insertBefore(c.nextElementSibling, c); saveAll(); } }
    function actualizarEfectos() { document.querySelectorAll('.map-url-input').forEach(i => checkPinStatus(i)); }
    function exportarDatos() { saveAll(); const d = { titulo: document.getElementById('titulo-viaje').innerText, cuerpo: document.getElementById('itinerario').innerHTML }; const blob = new Blob([JSON.stringify(d)], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "itinerario.json"; a.click(); }
    function importarDatos(input) { if (!input.files[0]) return; const r = new FileReader(); r.onload = e => { const d = JSON.parse(e.target.result); document.getElementById('titulo-viaje').innerText = d.titulo; document.getElementById('itinerario').innerHTML = d.cuerpo; actualizarEfectos(); saveAll(); location.reload(); }; r.readAsText(input.files[0]); }
    function limpiarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
    async function sincronizarGitHub() {
        let url = localStorage.getItem('github_url');
        if (!url || url === "null") { url = prompt("URL 'Raw' de GitHub:"); if (url) localStorage.setItem('github_url', url.trim()); }
        if (!url) return;
        try {
            const response = await fetch(url + "?cb=" + Date.now());
            const d = await response.json();
            if (confirm("¿Actualizar?")) { document.getElementById('titulo-viaje').innerText = d.titulo; document.getElementById('itinerario').innerHTML = d.cuerpo; actualizarEfectos(); saveAll(); location.reload(); }
        } catch (e) { alert("Error Sync"); localStorage.removeItem('github_url'); }
    }
    function handleMediaAction(btn, type) { if (btn.classList.contains('btn-delete-media')) { btn.closest('.bloque').querySelector(type === 'img' ? '.media-preview' : '.audio-player').innerHTML = ""; btn.innerHTML = type === 'img' ? "🖼️" : "🎤"; btn.classList.remove('btn-delete-media'); saveAll(); } else { btn.nextElementSibling.click(); } }
    function processFile(input, type) { const file = input.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (e) => { const div = input.closest('.bloque').querySelector(type === 'img' ? '.media-preview' : '.audio-player'); div.innerHTML = type === 'img' ? `<img src="${e.target.result}" style="width:100%;border-radius:10px;margin-top:5px;">` : `<audio controls src="${e.target.result}" style="width:100%;margin-top:5px;"></audio>`; const btn = input.previousElementSibling; btn.innerHTML = "✕"; btn.classList.add('btn-delete-media'); saveAll(); }; reader.readAsDataURL(file); }
</script>
</body>
</html>
