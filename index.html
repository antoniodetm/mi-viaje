<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerario Viaje Pro</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f2f2f7; margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            font-size: 17px;
        }
        
        .fixed-nav {
            position: sticky; top: 0; width: 100%; max-width: 400px;
            background: #f2f2f7; z-index: 1000; padding: 8px;
            box-sizing: border-box; display: flex; flex-direction: column; gap: 6px;
        }

        .container { 
            background: white; padding: 10px; border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; 
            max-width: 400px; box-sizing: border-box; min-height: 95vh;
        }
        
        .nav-row-triple { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        
        .action-btn { 
            padding: 6px 2px; border: none; border-radius: 10px; 
            font-weight: 700; font-size: 13px; color: white; 
            display: flex; align-items: center; justify-content: center; 
            min-height: 38px; cursor: pointer;
        }

        /* PANTALLA INICIO */
        .lista-dias-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .dia-card {
            background: #1c1c1e; color: white; padding: 14px;
            border-radius: 15px; display: flex; flex-direction: column; gap: 8px;
            position: relative; border: 1px solid #3a3a3c;
        }
        
        .input-card {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); 
            color: white; outline: none; padding: 6px; width: 92%; border-radius: 8px;
            font-family: inherit;
        }
        .input-fecha { font-size: 13px; text-transform: uppercase; font-weight: bold; color: #0a84ff; }
        .input-nombre { font-size: 19px; font-weight: 700; }

        .btn-entrar {
            background: #0a84ff; color: white; border: none; border-radius: 10px;
            padding: 10px; font-weight: 800; font-size: 14px; width: 100%; cursor: pointer;
            text-transform: uppercase;
        }

        /* VISTA DETALLE */
        #vista-detalle { display: none; width: 100%; }
        .back-btn { background: #8e8e93; margin-bottom: 12px; width: 90px; font-size: 13px; min-height: 30px; }
        
        .dia-header-detalle h3 { margin: 0; font-size: 22px; font-weight: 800; }
        .dia-header-detalle .meta-fecha { font-size: 13px; color: #0a84ff; font-weight: bold; }

        .dia-controls { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 4px; padding: 8px 4px; background: #e5e5ea; 
            border-radius: 10px; margin: 8px 0;
        }
        .dia-controls .action-btn { font-size: 10px; min-height: 32px; }

        /* Bloques de Eventos Compactos */
        .bloque { margin: 10px 0; border: 1px solid #d1d1d6; border-radius: 12px; position: relative; padding-left: 32px; background: #fff; overflow: hidden; }
        .controls-left { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; display: flex; flex-direction: column; border-right: 1px solid #e5e5ea; background: #f9f9f9; }
        .btn-ctrl { flex: 1; border: none; background: transparent; font-size: 14px; cursor: pointer; padding: 0; }

        table { width: 100%; border-collapse: collapse; }
        /* AJUSTE: Reducción de padding vertical de 8px a 2px */
        td { padding: 2px 4px; border-bottom: 1px solid #f2f2f7; font-size: 15px; }
        .col-label { width: 45px; font-size: 10px; color: #8e8e93; text-transform: uppercase; font-weight: 800; padding-left: 6px; }
        
        /* AJUSTE: Reducción de padding vertical en cabecera de 6px a 3px */
        .destacado td { font-weight: 800; color: #000000 !important; font-size: 17px; padding: 3px 4px; }
        
        .tipo-visita { background-color: #34c759 !important; }
        .tipo-comida { background-color: #ff9500 !important; }
        .tipo-cena { background-color: #af52de !important; }
        .tipo-salida { background-color: #8e8e93 !important; }

        .pin-map { cursor: pointer; font-size: 20px; filter: grayscale(1); display: inline-block; vertical-align: middle; }
        .pin-active { filter: grayscale(0) !important; transform: scale(1.1); }
        .btn-del-map, .btn-del-photo { font-size: 14px; cursor: pointer; margin-left: 5px; vertical-align: middle; display: none; }
        
        input[type="time"] { border: 1px solid #d1d1d6; border-radius: 6px; font-size: 16px; padding: 2px; font-family: inherit; color: #000; width: 85px; }
        .media-preview img { width: 100%; border-radius: 8px; margin-top: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body onclick="closeAllPopovers(event)">

<div class="fixed-nav" id="nav-superior">
    <div class="nav-row-triple">
        <button class="action-btn" style="background:#007aff" onclick="exportarDatos()">⬇️ Guardar</button>
        <button class="action-btn" style="background:#5856d6" onclick="sincronizarGitHub()">🔄 Sync</button>
        <label for="importFile" class="action-btn" style="background:#8e8e93">⬆️ Abrir</label>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDatos(this)">
    </div>
    <button class="action-btn" style="background:#1c1c1e; width: 100%; font-size: 15px;" onclick="addDia()">+ Añadir Día</button>
</div>

<div class="container">
    <div id="pantalla-inicio">
        <h2 id="titulo-viaje" contenteditable="true" style="text-align:center; font-size: 24px; margin: 10px 0;" onblur="saveAll()">Mi Viaje</h2>
        <div id="lista-dias" class="lista-dias-menu"></div>
        <button class="action-btn" style="background:#ff3b30; width: 100%; margin-top: 40px; font-size: 14px;" onclick="limpiarTodo()">🗑️ Borrar Todo</button>
    </div>

    <div id="vista-detalle">
        <button class="action-btn back-btn" onclick="volverAlInicio()">⬅️ Volver</button>
        <div id="contenido-dia-activo"></div>
    </div>
</div>

<div id="itinerario-master" class="hidden"></div>

<script>
    function saveAll() {
        document.querySelectorAll('input').forEach(i => {
            if(i.type === 'text' || i.type === 'time') i.setAttribute('value', i.value);
        });
        localStorage.setItem('miItinerario', document.getElementById('itinerario-master').innerHTML);
        localStorage.setItem('tituloViaje', document.getElementById('titulo-viaje').innerText);
    }

    window.onload = () => {
        const saved = localStorage.getItem('miItinerario');
        const savedTitle = localStorage.getItem('tituloViaje');
        if (savedTitle) document.getElementById('titulo-viaje').innerText = savedTitle;
        if (saved) document.getElementById('itinerario-master').innerHTML = saved;
        renderCalendario();
    };

    function renderCalendario() {
        const lista = document.getElementById('lista-dias');
        lista.innerHTML = "";
        const dias = document.querySelectorAll('#itinerario-master .dia-container');
        dias.forEach(dia => {
            const fecha = dia.getAttribute('data-fecha') || "DÍA --";
            const nombre = dia.getAttribute('data-nombre') || "Nuevo Destino";
            const card = document.createElement('div');
            card.className = 'dia-card';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div style="flex:1">
                        <input type="text" class="input-card input-fecha" value="${fecha}" oninput="actualizarMeta('${dia.id}', 'data-fecha', this.value)">
                        <input type="text" class="input-card input-nombre" value="${nombre}" oninput="actualizarMeta('${dia.id}', 'data-nombre', this.value)">
                    </div>
                    <span style="color:#ff3b30; font-size:24px; padding:2px 8px; cursor:pointer; font-weight:bold;" onclick="borrarDia('${dia.id}')">✕</span>
                </div>
                <button class="btn-entrar" onclick="abrirDia('${dia.id}')">VER DETALLE ➔</button>
            `;
            lista.appendChild(card);
        });
    }

    function actualizarMeta(id, atributo, valor) {
        const dia = document.getElementById(id);
        if(dia) { dia.setAttribute(atributo, valor); saveAll(); }
    }

    function addDia() {
        const id = "dia-" + Date.now();
        const num = document.querySelectorAll('#itinerario-master .dia-container').length + 1;
        const html = `
        <div class="dia-container" id="${id}" data-fecha="DÍA ${num}" data-nombre="Nuevo Destino">
            <div class="dia-controls">
                <button class="action-btn" style="background:#8e8e93" onclick="addEvento('${id}', 'solo-salida')">Salida</button>
                <button class="action-btn" style="background:#34c759" onclick="addEvento('${id}', 'visita')">Visita</button>
                <button class="action-btn" style="background:#ff9500" onclick="addEvento('${id}', 'comida')">Comida</button>
                <button class="action-btn" style="background:#af52de" onclick="addEvento('${id}', 'cena')">Cena</button>
            </div>
            <div class="eventos-lista"></div>
        </div>`;
        document.getElementById('itinerario-master').insertAdjacentHTML('beforeend', html);
        saveAll(); renderCalendario();
    }

    function abrirDia(id) {
        const dia = document.getElementById(id);
        if (!dia) return;
        document.getElementById('nav-superior').style.display = 'none';
        document.getElementById('pantalla-inicio').style.display = 'none';
        const contenedorActivo = document.getElementById('contenido-dia-activo');
        contenedorActivo.innerHTML = `
            <div class="dia-header-detalle" style="background:#1c1c1e; color:white; padding:15px; border-radius:15px 15px 0 0; border-bottom: 3px solid #0a84ff;">
                <div class="meta-fecha">${dia.getAttribute('data-fecha')}</div>
                <h3>${dia.getAttribute('data-nombre')}</h3>
            </div>
        `;
        contenedorActivo.appendChild(dia);
        document.getElementById('vista-detalle').style.display = 'block';
        window.scrollTo(0,0);
    }

    function volverAlInicio() {
        const diaActivo = document.querySelector('#contenido-dia-activo .dia-container');
        if (diaActivo) document.getElementById('itinerario-master').appendChild(diaActivo);
        document.getElementById('nav-superior').style.display = 'block';
        document.getElementById('pantalla-inicio').style.display = 'block';
        document.getElementById('vista-detalle').style.display = 'none';
        saveAll(); renderCalendario();
    }

    function borrarDia(id) {
        if(confirm('¿Eliminar día?')) { document.getElementById(id).remove(); saveAll(); renderCalendario(); }
    }

    function addEvento(diaId, tipo) {
        const lista = document.querySelector(`#${diaId} .eventos-lista`);
        let clase = 'tipo-visita', texto = 'VISITA', dual = true;
        if(tipo === 'comida') { clase = 'tipo-comida'; texto = 'COMIDA'; }
        if(tipo === 'cena') { clase = 'tipo-cena'; texto = 'CENA'; }
        if(tipo === 'solo-salida') { clase = 'tipo-salida'; texto = 'SALIDA'; dual = false; }
        
        const html = `
        <div class="bloque">
            <div class="controls-left">
                <button class="btn-ctrl" style="color:#ff3b30" onclick="this.closest('.bloque').remove();saveAll();">✕</button>
                <button class="btn-ctrl" onclick="moveUp(this)">▲</button>
                <button class="btn-ctrl" onclick="moveDown(this)">▼</button>
            </div>
            <table oninput="saveAll()">
                <tr class="destacado ${clase}">
                    <td colspan="2" contenteditable="true">${texto}</td>
                    <td style="text-align:right"><input type="time" oninput="this.setAttribute('value', this.value)"></td>
                </tr>
                <tr><td class="col-label">Lugar</td><td colspan="2"><div style="display:flex; justify-content:space-between; align-items:center;">
                    <span contenteditable="true" style="flex:1; font-weight:600;">...</span>
                    <div style="position:relative; display:flex; align-items:center;">
                        <span class="pin-map" onclick="handlePinClick(this, event)">📍</span>
                        <span class="btn-del-map" onclick="borrarURL(this, event)">🗑️</span>
                        <div class="map-popover" style="display:none; position:absolute; background:white; padding:8px; border:2px solid #0a84ff; right:0; top:30px; z-index:100; width:180px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.2);" onclick="event.stopPropagation()">
                            <input type="text" class="url-input" placeholder="URL..." style="width:100%; font-size:12px; padding:5px;" oninput="updatePinStatus(this)">
                        </div>
                    </div></div></td>
                </tr>
                <tr><td class="col-label">Notas</td><td colspan="2" contenteditable="true" style="min-height:20px;">...</td></tr>
                <tr><td class="col-label">Media</td><td colspan="2">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <button class="action-btn" style="background:#e5e5ea; color:black; width:auto; padding:2px 10px; min-height:28px; font-size:11px;" onclick="this.nextElementSibling.click()">📷 Foto</button>
                        <input type="file" accept="image/*" style="display:none" onchange="processFile(this)">
                        <span class="btn-del-photo" onclick="borrarFoto(this)">🗑️</span>
                    </div>
                    <div class="media-preview"></div></td>
                </tr>
                ${dual ? `<tr><td class="col-label">Salida</td><td colspan="2" style="text-align:right"><input type="time" oninput="this.setAttribute('value', this.value)"></td></tr>` : ''}
            </table>
        </div>`;
        lista.insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function handlePinClick(pin, event) {
        event.stopPropagation();
        const popover = pin.closest('div').querySelector('.map-popover');
        const input = popover.querySelector('input');
        if (input.value.startsWith('http')) {
            window.open(input.value, '_blank');
        } else {
            document.querySelectorAll('.map-popover').forEach(p => p.style.display = 'none');
            popover.style.display = 'block';
            input.focus();
        }
    }

    function updatePinStatus(input) {
        input.setAttribute('value', input.value);
        const container = input.closest('div').parentElement;
        const pin = container.querySelector('.pin-map');
        const delBtn = container.querySelector('.btn-del-map');
        if (input.value.includes('http')) {
            pin.classList.add('pin-active');
            delBtn.style.display = 'inline-block';
        } else {
            pin.classList.remove('pin-active');
            delBtn.style.display = 'none';
        }
        saveAll();
    }

    function borrarURL(btn, event) {
        event.stopPropagation();
        const container = btn.parentElement;
        const input = container.querySelector('.url-input');
        input.value = "";
        updatePinStatus(input);
        document.querySelectorAll('.map-popover').forEach(p => p.style.display = 'none');
    }

    function borrarFoto(btn) {
        const td = btn.closest('td');
        td.querySelector('.media-preview').innerHTML = "";
        btn.style.display = 'none';
        saveAll();
    }

    function closeAllPopovers(e) {
        if (!e.target.closest('.map-popover')) {
            document.querySelectorAll('.map-popover').forEach(p => p.style.display = 'none');
        }
    }

    function processFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width, height = img.height;
                if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                const preview = input.closest('td').querySelector('.media-preview');
                preview.innerHTML = `<img src="${canvas.toDataURL('image/jpeg', 0.6)}">`;
                input.closest('td').querySelector('.btn-del-photo').style.display = 'inline-block';
                saveAll();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function moveUp(btn) { const c = btn.closest('.bloque'); if (c.previousElementSibling) { c.parentNode.insertBefore(c, c.previousElementSibling); saveAll(); } }
    function moveDown(btn) { const c = btn.closest('.bloque'); if (c.nextElementSibling) { c.parentNode.insertBefore(c.nextElementSibling, c); saveAll(); } }
    function exportarDatos() { saveAll(); const d = { titulo: document.getElementById('titulo-viaje').innerText, cuerpo: document.getElementById('itinerario-master').innerHTML }; const blob = new Blob([JSON.stringify(d)], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "viaje.json"; a.click(); }
    function importarDatos(input) { const r = new FileReader(); r.onload = e => { const d = JSON.parse(e.target.result); document.getElementById('itinerario-master').innerHTML = d.cuerpo; document.getElementById('titulo-viaje').innerText = d.titulo; renderCalendario(); saveAll(); }; r.readAsText(input.files[0]); }
    function limpiarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
    async function sincronizarGitHub() {
        let url = localStorage.getItem('github_url') || prompt("URL 'Raw' de GitHub:");
        if (!url) return;
        localStorage.setItem('github_url', url);
        try {
            const response = await fetch(url + "?cb=" + Date.now());
            const d = await response.json();
            document.getElementById('itinerario-master').innerHTML = d.cuerpo;
            document.getElementById('titulo-viaje').innerText = d.titulo;
            renderCalendario(); saveAll(); alert("✅");
        } catch (e) { alert("❌"); }
    }
</script>
</body>
</html>
