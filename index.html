<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerario Viaje Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f2f2f7; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 10px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        .main-nav { position: sticky; top: 0; background: white; z-index: 1000; padding: 10px 0; border-bottom: 1px solid #d1d1d6; display: flex; flex-direction: column; gap: 8px; }
        .nav-row-quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .action-btn { padding: 2px; border: none; border-radius: 8px; font-weight: 600; font-size: 11px; color: white; display: flex; align-items: center; justify-content: center; min-height: 35px; cursor: pointer; }
        
        .dia-container { margin-bottom: 15px; border: 1px solid #d1d1d6; border-radius: 12px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
        
        .bloque-dia-header { background: #1c1c1e; color: white; display: grid; grid-template-columns: 1fr auto 40px; align-items: center; cursor: pointer; min-height: 65px; }
        .header-info-wrapper { padding: 6px 12px; display: flex; flex-direction: column; gap: 0px; }
        
        .header-info-wrapper h3 { margin: 0; font-size: 11px; font-weight: 400; opacity: 0.7; text-transform: uppercase; }
        .nombre-dia-personalizado { font-size: 22px; font-weight: 800; line-height: 1.1; }
        
        .clima-wrapper { display: flex; align-items: center; gap: 10px; padding-right: 12px; }
        .clima-icon { font-size: 30px; }
        .temp-row { display: flex; gap: 8px; font-size: 18px; font-weight: 900; }
        
        .dia-management-block { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #2c2c2e; height: 100%; border-left: 1px solid #3a3a3c; align-self: stretch; }
        .btn-dia-order { background: transparent; border: none; color: white; font-size: 12px; padding: 5px; cursor: pointer; width: 100%; }
        .btn-dia-delete { color: #ff453a; font-size: 16px; padding: 5px; cursor: pointer; }

        .dia-contenido { display: none; padding-bottom: 10px; }
        .dia-contenido.abierto { display: block; }
        .dia-controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px; background: #f2f2f7; }
        .bloque { margin: 8px; border: 1px solid #e5e5ea; border-radius: 10px; position: relative; padding-left: 32px; background: #fff; }
        .bloque.completado { opacity: 0.4; filter: grayscale(1); }
        .controls-left { position: absolute; left: 0; top: 0; bottom: 0; width: 32px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #e5e5ea; background: #f9f9f9; }
        .btn-ctrl { width: 100%; flex: 1; border: none; background: transparent; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        table { width: 100%; border-collapse: collapse; table-layout: auto; }
        td { padding: 8px 6px; border-bottom: 1px solid #f2f2f7; font-size: 14px; }
        .destacado td { font-weight: 800; color: white; }
        .col-label { width: 1px; white-space: nowrap; font-size: 11px; font-weight: 600; color: #8e8e93; text-transform: uppercase; padding-right: 10px; vertical-align: middle; }
        .col-data { width: 100%; }

        .pin-map { cursor: pointer; font-size: 18px; filter: grayscale(1); transition: 0.2s; }
        .pin-active { filter: grayscale(0) !important; transform: scale(1.2); }
        .media-area { width: 100%; display: block; margin-top: 5px; }
        .media-item { width: 100%; margin-bottom: 5px; }
        .media-item img { width: 100%; height: auto; border-radius: 8px; border: 1px solid #ddd; display: block; }
        .media-item audio { width: 100%; height: 35px; display: block; }
        .media-btns { display: flex; gap: 15px; margin-top: 8px; }
        .media-btn-small { background: #e5e5ea; border: none; border-radius: 6px; padding: 8px 12px; font-size: 16px; cursor: pointer; min-width: 50px; }
        .btn-danger { background: #ff3b30 !important; color: white !important; }
        .tipo-visita { background-color: #34c759 !important; }
        .tipo-comida { background-color: #ff9500 !important; }
        .tipo-cena { background-color: #af52de !important; }
        .tipo-salida { background-color: #8e8e93 !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="titulo-viaje" contenteditable="true" style="text-align:center; font-size: 20px; margin: 10px 0;" onblur="saveAll()">Mi Itinerario</h2>
    
    <div class="main-nav">
        <div class="nav-row-quad">
            <button class="action-btn" style="background:#007aff" onclick="exportarDatos()">⬇️ Guardar</button>
            <button class="action-btn" style="background:#34c759" onclick="document.getElementById('import-file').click()">📂 Abrir</button>
            <input type="file" id="import-file" style="display:none" accept=".json" onchange="importarDatos(this)">
            <button id="sync-btn" class="action-btn" style="background:#5856d6" onclick="sincronizarGitHub()">🔄 Sync</button>
            <button class="action-btn" style="background:#1c1c1e" onclick="addDia()">+ Día</button>
        </div>
    </div>

    <div id="itinerario"></div>
    <button class="action-btn" style="background:#ff3b30; width: 100%; margin-top: 15px;" onclick="limpiarTodo()">🗑️ Borrar Todo</button>
</div>

<script>
    const weatherIcons = { 0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 51: "🌦️", 61: "🌧️", 71: "❄️", 95: "⛈️" };
    const GITHUB_URL = "https://raw.githubusercontent.com/antoniodetm/mi-viaje/main/itinerario_viaje.json";

    window.onload = () => {
        const saved = localStorage.getItem('miItinerario');
        const savedTitle = localStorage.getItem('tituloViaje');
        if (savedTitle) document.getElementById('titulo-viaje').innerText = savedTitle;
        if (saved && saved.trim() !== "") {
            document.getElementById('itinerario').innerHTML = saved;
            actualizarEfectos();
        } else { addDia(); }
    };

    async function sincronizarGitHub() {
        const btn = document.getElementById('sync-btn');
        btn.innerText = "⌛...";
        const finalUrl = `https://api.codetabs.com/v1/proxy?quest=${GITHUB_URL}&t=${Date.now()}`;
        try {
            const response = await fetch(finalUrl);
            const d = await response.json();
            if (confirm("¿Actualizar desde GitHub?")) {
                document.getElementById('titulo-viaje').innerText = d.titulo;
                document.getElementById('itinerario').innerHTML = d.cuerpo;
                saveAll(); location.reload();
            }
        } catch (e) { alert("Error de Sync."); } finally { btn.innerText = "🔄 Sync"; }
    }

    function saveAll() {
        document.querySelectorAll('input').forEach(i => { if(i.type !== "file") i.setAttribute('value', i.value); });
        document.querySelectorAll('.check-completar').forEach(c => c.checked ? c.setAttribute('checked', 'checked') : c.removeAttribute('checked'));
        localStorage.setItem('miItinerario', document.getElementById('itinerario').innerHTML);
        localStorage.setItem('tituloViaje', document.getElementById('titulo-viaje').innerText);
    }

    function addDia() {
        let fechaParaMostrar = new Date().toISOString().split('T')[0];
        const todosLosDias = document.querySelectorAll('.dia-container h3');
        
        if (todosLosDias.length > 0) {
            const ultimaFechaTexto = todosLosDias[todosLosDias.length - 1].innerText.replace('DÍA: ', '').trim();
            const ultimaFecha = new Date(ultimaFechaTexto);
            if (!isNaN(ultimaFecha)) {
                ultimaFecha.setDate(ultimaFecha.getDate() + 1);
                fechaParaMostrar = ultimaFecha.toISOString().split('T')[0];
            }
        }

        const id = "dia-" + Date.now();
        const html = `<div class="dia-container" id="${id}">
            <div class="bloque-dia-header" onclick="toggleDia(this)">
                <div class="header-info-wrapper">
                    <h3 contenteditable="true" onclick="event.stopPropagation()">DÍA: ${fechaParaMostrar}</h3>
                    <div class="nombre-dia-personalizado" contenteditable="true" onblur="fetchClimaGlobal(this)">Destino...</div>
                </div>
                <div class="clima-wrapper"></div>
                <div class="dia-management-block">
                    <button class="btn-dia-order" onclick="moverDia(this, 'arriba')">▲</button>
                    <span class="btn-dia-delete" onclick="if(confirm('¿Borrar?')){this.closest('.dia-container').remove();saveAll();}">✕</span>
                    <button class="btn-dia-order" onclick="moverDia(this, 'abajo')">▼</button>
                </div>
            </div>
            <div class="dia-contenido"><div class="dia-controls">
                <button class="action-btn tipo-visita" onclick="addEvento('${id}', 'visita')">Visita</button>
                <button class="action-btn tipo-comida" onclick="addEvento('${id}', 'comida')">Comida</button>
                <button class="action-btn tipo-cena" onclick="addEvento('${id}', 'cena')">Cena</button>
                <button class="action-btn tipo-salida" onclick="addEvento('${id}', 'solo-salida')">Salida</button>
            </div><div class="eventos-lista"></div></div>
        </div>`;
        document.getElementById('itinerario').insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function addEvento(diaId, tipo) {
        const lista = document.querySelector(`#${diaId} .eventos-lista`);
        let clase = 'tipo-visita', texto = 'VISITA';
        if(tipo === 'comida') { clase = 'tipo-comida'; texto = 'COMIDA'; }
        if(tipo === 'cena') { clase = 'tipo-cena'; texto = 'CENA'; }
        if(tipo === 'solo-salida') { clase = 'tipo-salida'; texto = 'SALIDA'; }
        
        const html = `<div class="bloque">
            <div class="controls-left">
                <div class="check-wrapper"><input type="checkbox" class="check-completar" onclick="toggleCompletado(this)"></div>
                <button class="btn-ctrl" onclick="moveUp(this)">▲</button><button class="btn-ctrl" onclick="moveDown(this)">▼</button>
                <button class="btn-ctrl" style="color:red" onclick="if(confirm('¿Borrar?')){this.closest('.bloque').remove();saveAll();}">✕</button>
            </div>
            <table oninput="saveAll()">
                <tr class="destacado ${clase}"><td colspan="2" contenteditable="true" class="col-data">${texto}</td><td style="text-align:right; width:50px;"><input type="time" style="width:100%; border:none; background:transparent; color:white; font-weight:bold;"></td></tr>
                <tr><td class="col-label">Lugar</td><td contenteditable="true" onblur="checkMapUrl(this)" class="col-data">...</td><td style="width:30px; text-align:right"><span class="pin-map" onclick="openMap(this)">📍</span></td></tr>
                <tr><td class="col-label">Notas</td><td colspan="2" contenteditable="true" class="col-data"></td></tr>
                <tr><td class="col-label">Media</td><td colspan="2" class="col-data">
                    <div class="media-area"></div>
                    <div class="media-btns">
                        <button class="media-btn-small btn-foto" onclick="handleMediaAction(this, 'img')">📸</button>
                        <input type="file" hidden accept="image/*" onchange="processFile(this, 'img')">
                        <button class="media-btn-small btn-audio" onclick="handleMediaAction(this, 'aud')">🎙️</button>
                        <input type="file" hidden accept="audio/*" onchange="processFile(this, 'aud')">
                    </div>
                </td></tr>
            </table><input type="hidden" class="map-url-hidden">
        </div>`;
        lista.insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function handleMediaAction(btn, tipo) {
        const area = btn.closest('td').querySelector('.media-area');
        const existing = area.querySelector(`[data-type="${tipo}"]`);
        if (existing) { if (confirm("¿Eliminar archivo?")) { existing.remove(); btn.innerText = (tipo === 'img' ? '📸' : '🎙️'); btn.classList.remove('btn-danger'); saveAll(); } } else { btn.nextElementSibling.click(); }
    }

    function processFile(input, tipo) {
        const file = input.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const container = input.closest('td').querySelector('.media-area');
            const btn = tipo === 'img' ? input.closest('td').querySelector('.btn-foto') : input.closest('td').querySelector('.btn-audio');
            const content = tipo === 'img' ? `<div class="media-item" data-type="img"><img src="${e.target.result}"></div>` : `<div class="media-item" data-type="aud"><audio controls src="${e.target.result}"></audio></div>`;
            container.innerHTML += content; btn.innerText = "✕"; btn.classList.add('btn-danger'); saveAll(); input.value = ""; 
        };
        reader.readAsDataURL(file);
    }

    function checkMapUrl(el) {
        const txt = el.innerText; const url = txt.match(/\bhttps?:\/\/\S+/gi);
        if(url) { el.closest('.bloque').querySelector('.map-url-hidden').value = url[0]; el.closest('.bloque').querySelector('.pin-map').classList.add('pin-active'); el.innerText = txt.replace(url[0], "").trim() || "Mapa"; }
        saveAll();
    }

    function openMap(el) {
        const hiddenInput = el.closest('.bloque').querySelector('.map-url-hidden');
        let currentUrl = hiddenInput.value;
        if(currentUrl) { if(confirm("¿Abrir mapa? (Cancelar para editar el link)")) { window.open(currentUrl, '_blank'); } else { let nueva = prompt("Edita o pega el enlace de Google Maps:", currentUrl); if(nueva !== null) { hiddenInput.value = nueva; el.classList.toggle('pin-active', nueva.trim() !== ""); saveAll(); } } } else { let url = prompt("Pega el enlace de Google Maps aquí:"); if(url) { hiddenInput.value = url; el.classList.add('pin-active'); saveAll(); } }
    }

    async function fetchClimaGlobal(el) {
        const nombre = el.innerText.trim();
        const wrapperClima = el.closest('.dia-container').querySelector('.clima-wrapper');
        if (!nombre || nombre === "Destino...") return;
        try {
            const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nombre)}&count=1&language=es&format=json`);
            const geoData = await geo.json();
            if (geoData.results) {
                const { latitude, longitude } = geoData.results[0];
                const weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`);
                const wData = await weather.json();
                const icon = weatherIcons[wData.daily.weathercode[0]] || "🌡️";
                wrapperClima.innerHTML = `
                    <span class="clima-icon">${icon}</span>
                    <div class="temp-row">
                        <span style="color:#ff453a">${Math.round(wData.daily.temperature_2m_max[0])}°</span>
                        <span style="color:#0a84ff">${Math.round(wData.daily.temperature_2m_min[0])}°</span>
                    </div>`;
            }
        } catch (e) {}
    }

    function toggleDia(header) { if (event.target.closest('.dia-management-block') || event.target.hasAttribute('contenteditable') || event.target.tagName === 'BUTTON') return; header.nextElementSibling.classList.toggle('abierto'); }
    function toggleCompletado(check) { check.closest('.bloque').classList.toggle('completado', check.checked); saveAll(); }
    function moveUp(btn) { const c = btn.closest('.bloque'); if (c.previousElementSibling) { c.parentNode.insertBefore(c, c.previousElementSibling); saveAll(); } }
    function moveDown(btn) { const c = btn.closest('.bloque'); if (c.nextElementSibling) { c.parentNode.insertBefore(c.nextElementSibling, c); saveAll(); } }
    function moverDia(btn, dir) { const dia = btn.closest('.dia-container'); dir === 'arriba' ? (dia.previousElementSibling && dia.parentNode.insertBefore(dia, dia.previousElementSibling)) : (dia.nextElementSibling && dia.parentNode.insertBefore(dia.nextElementSibling, dia)); saveAll(); }
    function exportarDatos() { saveAll(); const d = { titulo: document.getElementById('titulo-viaje').innerText, cuerpo: document.getElementById('itinerario').innerHTML }; const blob = new Blob([JSON.stringify(d)], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "itinerario.json"; a.click(); }
    function importarDatos(input) { const r = new FileReader(); r.onload = e => { const d = JSON.parse(e.target.result); document.getElementById('itinerario').innerHTML = d.cuerpo; document.getElementById('titulo-viaje').innerText = d.titulo; saveAll(); location.reload(); }; r.readAsText(input.files[0]); }
    function limpiarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
    
    function actualizarEfectos() { 
        document.querySelectorAll('.check-completar').forEach(c => { if(c.hasAttribute('checked')) { c.checked = true; c.closest('.bloque').classList.add('completado'); } });
        document.querySelectorAll('.map-url-hidden').forEach(h => { if(h.value) h.closest('.bloque').querySelector('.pin-map').classList.add('pin-active'); });
        document.querySelectorAll('.media-area').forEach(area => {
            if (area.querySelector('[data-type="img"]')) { let b = area.closest('td').querySelector('.btn-foto'); b.innerText = "✕"; b.classList.add('btn-danger'); }
            if (area.querySelector('[data-type="aud"]')) { let b = area.closest('td').querySelector('.btn-audio'); b.innerText = "✕"; b.classList.add('btn-danger'); }
        });
    }
</script>
</body>
</html>
