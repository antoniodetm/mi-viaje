<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Itinerario Viaje Pro</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f2f2f7; 
            margin: 0; 
            padding: 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .container { 
            background: white; 
            padding: 15px; 
            border-radius: 15px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            box-sizing: border-box; 
        }

        .main-nav { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 20px;
        }

        .action-btn { 
            padding: 12px; border: none; border-radius: 10px; 
            font-weight: 600; font-size: 14px; color: white; 
            display: flex; align-items: center; justify-content: center; min-height: 44px;
        }

        .dia-container { 
            margin-bottom: 25px; border: 1px solid #d1d1d6; 
            border-radius: 12px; background: #fff; overflow: hidden;
        }

        .bloque-dia-header { 
            background: #1c1c1e; color: white; padding: 12px 15px; 
            display: flex; justify-content: space-between; align-items: center;
        }

        .dia-controls { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 4px; padding: 8px; background: #f2f2f7;
        }

        .bloque { 
            margin: 10px; border: 1px solid #e5e5ea; border-radius: 10px; 
            position: relative; padding-left: 35px; 
        }

        .controls-left { 
            position: absolute; left: 0; top: 0; bottom: 0; width: 30px; 
            display: flex; flex-direction: column; border-right: 1px solid #e5e5ea; background: #f9f9f9;
        }

        .btn-ctrl { flex: 1; border: none; background: transparent; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        td { padding: 8px; border-bottom: 1px solid #f2f2f7; font-size: 14px; vertical-align: middle; }

        .col-label { width: 55px; font-size: 10px; color: #8e8e93; text-transform: uppercase; font-weight: bold; }

        /* Estilo de Horas solicitado */
        .time-wrapper { display: flex; justify-content: flex-end; gap: 8px; }
        
        input[type="time"] { 
            border-radius: 6px; 
            font-size: 16px !important; 
            width: 80px;
            padding: 4px;
            background: #fff;
            -webkit-appearance: none;
        }

        .time-start { border: 2px solid #007aff !important; } /* Azul para Inicio */
        .time-end { border: 2px solid #ff3b30 !important; }   /* Rojo para Fin/Salida */

        .destacado td { font-weight: bold; }
        .tipo-visita { border-top: 3px solid #007aff; }
        .tipo-comida { border-top: 3px solid #ff9500; }
        .tipo-cena { border-top: 3px solid #5856d6; }
        .tipo-salida { border-top: 3px solid #8e8e93; }

        .media-container { text-align: center; padding: 5px; border-bottom: 1px solid #f2f2f7; }
        .img-preview { width: 100%; border-radius: 8px; display: none; margin-top: 5px; }
        .audio-player { width: 100%; display: none; margin-top: 5px; }
        .upload-label { color: #007aff; font-size: 12px; font-weight: bold; display: block; padding: 10px; cursor: pointer; }
    </style>
</head>
<body oninput="saveAll()">

<div class="container">
    <h2 id="titulo-viaje" contenteditable="true" style="text-align:center">Mi Itinerario</h2>
    
    <div class="main-nav">
        <button class="action-btn" style="background:#1c1c1e; grid-column: span 2;" onclick="addDia()">+ Añadir Día</button>
        <button class="action-btn" style="background:#007aff" onclick="exportarDatos()">⬇️ Guardar</button>
        <button class="action-btn" style="background:#007aff" onclick="document.getElementById('importFile').click()">⬆️ Abrir</button>
        <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDatos(this)">
    </div>

    <div id="itinerario"></div>

    <button class="action-btn" style="background:#ff3b30; width: 100%; margin-top: 20px;" onclick="limpiarTodo()">🗑️ Borrar Todo</button>
</div>

<script>
    window.onload = () => {
        const saved = localStorage.getItem('miItinerario');
        const savedTitle = localStorage.getItem('tituloViaje');
        if (savedTitle) document.getElementById('titulo-viaje').innerText = savedTitle;
        if (saved) {
            document.getElementById('itinerario').innerHTML = saved;
            actualizarEfectos();
        } else {
            addDia();
        }
    };

    function saveAll() {
        document.querySelectorAll('input[type="time"]').forEach(i => i.setAttribute('value', i.value));
        localStorage.setItem('miItinerario', document.getElementById('itinerario').innerHTML);
        localStorage.setItem('tituloViaje', document.getElementById('titulo-viaje').innerText);
    }

    function actualizarEfectos() {
        document.querySelectorAll('input[type="time"]').forEach(input => {
            input.oninput = saveAll;
            if(input.getAttribute('value')) input.value = input.getAttribute('value');
        });
    }

    function addDia() {
        const id = "dia-" + Date.now();
        const html = `
        <div class="dia-container" id="${id}">
            <div class="bloque-dia-header">
                <h3 contenteditable="true">DÍA: ---</h3>
                <span onclick="if(confirm('¿Borrar día?')){this.closest('.dia-container').remove();saveAll();}">✕</span>
            </div>
            <div class="dia-controls">
                <button class="action-btn" style="background:#8e8e93" onclick="addEvento('${id}', 'solo-salida')">Salida</button>
                <button class="action-btn" style="background:#34c759" onclick="addEvento('${id}', 'visita')">Visita</button>
                <button class="action-btn" style="background:#ff9500" onclick="addEvento('${id}', 'comida')">Comida</button>
                <button class="action-btn" style="background:#af52de" onclick="addEvento('${id}', 'cena')">Cena</button>
            </div>
            <div class="eventos-lista"></div>
        </div>`;
        document.getElementById('itinerario').insertAdjacentHTML('beforeend', html);
        saveAll();
    }

    function addEvento(diaId, tipo) {
        const lista = document.querySelector(`#${diaId} .eventos-lista`);
        lista.insertAdjacentHTML('beforeend', generarHTMLBloque(tipo));
        saveAll();
    }

    function generarHTMLBloque(tipo) {
        let clase = 'tipo-visita', texto = 'VISITA', dual = true;
        if(tipo === 'comida') { clase = 'tipo-comida'; texto = 'COMIDA'; }
        if(tipo === 'cena') { clase = 'tipo-cena'; texto = 'CENA'; }
        if(tipo === 'solo-salida') { clase = 'tipo-salida'; texto = 'SALIDA'; dual = false; }
        
        return `
        <div class="bloque">
            <div class="controls-left">
                <button class="btn-ctrl" style="color:#ff3b30" onclick="this.closest('.bloque').remove();saveAll();">✕</button>
                <button class="btn-ctrl" onclick="moveUp(this)">▲</button>
                <button class="btn-ctrl" onclick="moveDown(this)">▼</button>
            </div>
            <table>
                <tr class="destacado ${clase}">
                    <td colspan="2" contenteditable="true">${texto}</td>
                    <td style="text-align:right" contenteditable="true">1h</td>
                </tr>
                <tr>
                    <td class="col-label">Lugar</td>
                    <td colspan="2" contenteditable="true">...</td>
                </tr>
                <tr>
                    <td class="col-label">Notas</td>
                    <td colspan="2" contenteditable="true">...</td>
                </tr>
                <tr>
                    <td class="col-label">Horas</td>
                    <td colspan="2">
                        <div class="time-wrapper">
                            <input type="time" class="time-start" value="00:00" oninput="saveAll()">
                            ${dual ? '<input type="time" class="time-end" value="00:00" oninput="saveAll()">' : ''}
                        </div>
                    </td>
                </tr>
                <tr>
                    <td colspan="3" class="media-container">
                        <label class="upload-label" onclick="this.nextElementSibling.click()">📷 Foto</label>
                        <input type="file" style="display:none" accept="image/*" onchange="previewMedia(this, 'img')">
                        <img class="img-preview">
                    </td>
                </tr>
                <tr>
                    <td colspan="3" class="media-container">
                        <label class="upload-label" onclick="this.nextElementSibling.click()">🎤 Audio</label>
                        <input type="file" style="display:none" accept="audio/*" onchange="previewMedia(this, 'aud')">
                        <audio controls class="audio-player"></audio>
                    </td>
                </tr>
            </table>
        </div>`;
    }

    function previewMedia(input, type) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const container = input.parentElement;
            const label = container.querySelector('.upload-label');
            const element = type === 'img' ? container.querySelector('.img-preview') : container.querySelector('.audio-player');
            element.src = e.target.result;
            element.style.display = 'block';
            if(label) label.style.display = 'none'; 
            saveAll();
        };
        reader.readAsDataURL(file);
    }

    function moveUp(btn) {
        const current = btn.closest('.bloque');
        const prev = current.previousElementSibling;
        if (prev) { current.parentNode.insertBefore(current, prev); saveAll(); }
    }

    function moveDown(btn) {
        const current = btn.closest('.bloque');
        const next = current.nextElementSibling;
        if (next) { current.parentNode.insertBefore(next, current); saveAll(); }
    }

    function exportarDatos() {
        saveAll();
        const datos = { titulo: document.getElementById('titulo-viaje').innerText, cuerpo: document.getElementById('itinerario').innerHTML };
        const blob = new Blob([JSON.stringify(datos)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "itinerario.json";
        a.click();
    }

    function importarDatos(input) {
        const reader = new FileReader();
        reader.onload = e => {
            const d = JSON.parse(e.target.result);
            document.getElementById('titulo-viaje').innerText = d.titulo;
            document.getElementById('itinerario').innerHTML = d.cuerpo;
            actualizarEfectos();
            saveAll();
        };
        reader.readAsText(input.files[0]);
    }

    function limpiarTodo() { if(confirm("¿Borrar todo?")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
